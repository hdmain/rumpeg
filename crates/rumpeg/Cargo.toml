[package]
name = "rumpeg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "High-performance multimedia framework in Rust — FFmpeg-inspired library crate"
keywords = ["multimedia", "ffmpeg", "audio", "video", "codec"]
categories = ["multimedia", "encoding"]
readme = "../../README.md"

[features]
default = []
## System libx264 (`-c:v libx264`). Needs pkg-config + libx264.
encode-x264 = ["rumpeg-codec/encode-x264"]
## NVIDIA NVENC (`-c:v h264_nvenc`). Windows + NVIDIA driver.
encode-nvenc = ["rumpeg-codec/encode-nvenc"]

[dependencies]
rumpeg-util = { workspace = true }
rumpeg-h264 = { workspace = true }
rumpeg-codec = { workspace = true }
rumpeg-format = { workspace = true }
rumpeg-scale = { workspace = true }
rumpeg-resample = { workspace = true }
rumpeg-filter = { workspace = true }

[[example]]
name = "decode_wav"
path = "../../examples/decode_wav.rs"

[[example]]
name = "generate_wav"
path = "../../examples/generate_wav.rs"

[[example]]
name = "extract_thumb"
path = "../../examples/extract_thumb.rs"
